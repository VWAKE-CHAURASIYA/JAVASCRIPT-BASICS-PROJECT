<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=
    , initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Password Look</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: linear-gradient(to right, pink, blue);
        }

        .form-info
        {
            width: 30%;
            height: 50%;
            background-color: #dadada;
            border-radius: 2rem;

            & h1{
                text-align: center;
                margin: 1rem auto;
                font-family: 'Times New Roman', Times, serif;
            }

            & form{
                display: flex;
                flex-direction: column;
                width: 60%;
                gap: 1rem;
                margin: 1rem auto;

                position: relative;

                & input{
                    padding: 1rem;
                    font-size: 1rem;
                }

                & i{
                    position: absolute;
                    top: 5.5rem;
                    right: 2rem;
                    cursor: pointer;
                }

            }
        }

      
    </style>
</head>
<body>
    <div class="form-info">
      <h1>Instagram</h1>
      <form action="#">
        <input type="text" placeholder="username or gmail"/>
            <input type="password" placeholder="password" id="password"><span><i class="fa-regular fa-eye" id="eye"></i></span>
          
      </form>
    </div>

    <script>
       let password  = document.getElementById("password");
       let icon = document.getElementById('eye');

       icon.addEventListener('click', ()=>
    {
        //here we give the conditonal statement to check the input type: based on that i need to change the icons: 
        if(password.type === "password")
    {
        password.type="text";
        icon.classList.replace('fa-eye', 'fa-eye-slash')
    }
    else{
        password.type = "password";
        icon.classList.replace('fa-eye-slash', 'fa-eye')
    }
    })
    </script>
</body>
</html>
